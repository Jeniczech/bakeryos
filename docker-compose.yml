services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: bakeryos
            POSTGRES_PASSWORD: bakeryos
            POSTGRES_DB: bakeryos
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U bakeryos -d bakeryos']
            interval: 2s
            timeout: 5s
            retries: 15

volumes:
    postgres-data:
